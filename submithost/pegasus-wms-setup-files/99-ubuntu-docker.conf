# Force binding to loopback/all interfaces cleanly
NETWORK_INTERFACE = 172.18.0.3
CONDOR_HOST = 172.18.0.3
COLLECTOR_HOST = $(CONDOR_HOST):9618

# Relax security/authorization for container-internal operations
ALLOW_READ = *
ALLOW_WRITE = *
ALLOW_DAEMON = *
ALLOW_ADMINISTRATOR = *
ALLOW_ADVERTISE_SCHEDD = *
ALLOW_ADVERTISE_STARTD = *
ALLOW_CLIENT = *
SEC_DEFAULT_AUTHENTICATION = NEVER
SEC_DAEMON_AUTHENTICATION = NEVER
SEC_CLIENT_AUTHENTICATION = NEVER
